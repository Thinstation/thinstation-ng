build-gitlab-ee:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_GITLAB_EE == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - when: never

  script:
    - |
      set -Eeuo pipefail
      [[ "$GITLAB_EE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
        echo "GITLAB_EE_VERSION must be major.minor.patch, got: $GITLAB_EE_VERSION" >&2
        exit 1
      }

    - sudo rm -rf build-gitlab-ee
    - sudo mkdir build-gitlab-ee
    - sudo mount -t tmpfs -o size=40G tmpfs build-gitlab-ee
    - sudo chown gitlab-runner:gitlab-runner build-gitlab-ee
    - ln -s "$CI_PROJECT_DIR/.git" build-gitlab-ee/.git
    - cd build-gitlab-ee
    - git checkout -f "$CI_COMMIT_SHA"
    - sudo env MAX_PARALLEL_DOWNLOADS="$MAX_PARALLEL_DOWNLOADS" MAX_DOWNLOADS_PER_MIRROR="$MAX_DOWNLOADS_PER_MIRROR" TS_EXTRA_PORTS="$TS_EXTRA_PORTS" ./setup-chroot -i
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo sed -i 's/^#package gitlab-ee/package gitlab-ee/' ts/build/build.conf
    - |
      if [[ -n "${MCP_SSH_PUBLIC_KEY:-}" ]]; then
        sudo sed -i 's/^#package openssh/package openssh/' ts/build/build.conf
        printf '%s\n' 'param authorized_keys /authorized_keys' \
          | sudo tee -a ts/build/build.conf >/dev/null
        printf '%s\n' "$MCP_SSH_PUBLIC_KEY" \
          | sudo tee authorized_keys >/dev/null
      else
        echo "MCP_SSH_PUBLIC_KEY is not set; skipping debug SSH key injection."
      fi

    - sudo sed -i -E "s#gitlab/gitlab-ee:[0-9]+\\.[0-9]+\\.[0-9]+-ee\\.0#gitlab/gitlab-ee:${GITLAB_EE_VERSION}-ee.0#" ts/build/packages/gitlab-ee/build/images.conf
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/gitlab-ee/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e stb
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso "$CI_PROJECT_DIR/gitlab-ee.iso"
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - mv gitlab-ee.iso "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso"
    - sha256sum "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso" > "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso" "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso.sha256"

  artifacts:
    name: "gitlab-ee-${GITLAB_EE_VERSION}-$CI_COMMIT_SHORT_SHA"
    paths:
      - gitlab-ee-*.iso
      - gitlab-ee-*.iso.sha256
    expire_in: 30 days

  after_script:
    - sudo umount build-gitlab-ee || true
    - sudo rm -rf build-gitlab-ee


test-usr-merge-prototype:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_COMMIT_BRANCH == "usr-merge-prototype" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      when: on_success
    - when: never
  script:
    - |
      set -Eeuo pipefail

      sudo rm -rf build-usr-merge
      sudo mkdir build-usr-merge
      sudo mount -t tmpfs -o size=24G tmpfs build-usr-merge
      sudo chown gitlab-runner:gitlab-runner build-usr-merge
      ln -s "$CI_PROJECT_DIR/.git" build-usr-merge/.git
      cd build-usr-merge
      git checkout -f "$CI_COMMIT_SHA"

      sudo ./setup-chroot -i
      sudo ./setup-chroot -e cp -a /build/conf/tiny/* /build/.
      sudo sed -i 's#param kernelcmdline "selinux=0"#param kernelcmdline "selinux=0 console=ttyS0"#' ts/build/build.conf

      check_layout() {
          test "$(readlink ts/build/tmp-tree/bin)" = "usr/bin"
          test "$(readlink ts/build/tmp-tree/sbin)" = "usr/sbin"
          test "$(readlink ts/build/tmp-tree/lib)" = "usr/lib64"
          test "$(readlink ts/build/tmp-tree/lib64)" = "usr/lib64"
          test "$(readlink ts/build/tmp-tree/usr/lib)" = "lib64"
          test ! -e ts/build/tmp-tree/libexec
          test ! -L ts/build/tmp-tree/libexec
          test -d ts/build/tmp-tree/usr/libexec
          test "$(readlink ts/build/tmp-tree/usr/local)" = "/usr"
          test -d ts/build/tmp-tree/usr/share
          test ! -L ts/build/tmp-tree/usr/share
          test ! -e ts/build/tmp-tree/share
          test ! -L ts/build/tmp-tree/share
          test ! -e ts/build/tmp-tree/usr/X11R7
          test ! -L ts/build/tmp-tree/usr/X11R7
          test -x ts/build/tmp-tree/usr/bin/systemctl
          test -d ts/build/tmp-tree/usr/lib64
      }

      boot_and_check() {
          mode="$1"
          expect_squash="$2"
          serial="/build/usr-merge-${mode}.serial"
          rm -f "ts/build/usr-merge-${mode}.serial" ts/build/bt-ipxe-http.log
          sudo sed -i 's/console=tty1/console=ttyS0 console=tty1/' ts/build/boot-images/grub/efi-source/boot/ipxe/autoexec.ipxe
          sudo env BT_SERIAL_FILE="$serial" timeout 55 ./setup-chroot -e ts/bin/bt net-efi --remote || true
          grep -F 'login:' "ts/build/usr-merge-${mode}.serial"
          if [[ "$expect_squash" == "yes" ]]; then
              grep -F 'GET /boot/lib.squash' ts/build/bt-ipxe-http.log
          else
              ! grep -F 'GET /boot/lib.squash' ts/build/bt-ipxe-http.log
          fi
      }

      echo "=== lotsofmem ==="
      sudo ./setup-chroot -e stb
      check_layout
      rm -rf ts/build/usr-squash-check
      sudo unsquashfs -f -d ts/build/usr-squash-check ts/build/boot-images/initrd/lib.squash >/dev/null
      test -x ts/build/usr-squash-check/usr/bin/systemctl
      test -d ts/build/usr-squash-check/usr/lib64
      cp ts/build/build.log ts/build/usr-merge-lotsofmem-build.log
      boot_and_check lotsofmem yes

      echo "=== mounted fastboot ==="
      sudo sed -i 's/^param fastboot[[:space:]].*/param fastboot       true/' ts/build/build.conf
      sudo ./setup-chroot -e stb
      check_layout
      cp ts/build/build.log ts/build/usr-merge-fastboot-build.log
      boot_and_check fastboot yes

      echo "=== non-fastboot ==="
      sudo sed -i 's/^param fastboot[[:space:]].*/param fastboot       false/' ts/build/build.conf
      sudo ./setup-chroot -e stb
      check_layout
      test ! -e ts/build/boot-images/initrd/lib.squash
      cp ts/build/build.log ts/build/usr-merge-nofastboot-build.log
      boot_and_check nofastboot no
  artifacts:
    when: always
    paths:
      - build-usr-merge/ts/build/usr-merge-*.serial
      - build-usr-merge/ts/build/usr-merge-*-build.log
      - build-usr-merge/ts/build/bt-ipxe-http.log
    expire_in: 7 days
  after_script:
    - sudo umount build-usr-merge || sudo umount -l build-usr-merge || true
    - sudo rm -rf build-usr-merge


build-mcp-ui:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$BUILD_MCP_UI == "1"'
      when: on_success
    - when: never
  script:
    - cd ts/build/packages/mcp-appliance/build/frontend
    - npm ci
    - npm run build
    - tar -C ../../usr/share/mcp-appliance/web -czf "$CI_PROJECT_DIR/mcp-ui.tar.gz" .
  artifacts:
    paths:
      - mcp-ui.tar.gz
    expire_in: 2 days

stage-mcp-ui-distro:
  stage: deploy
  tags:
    - distro
  needs:
    - job: build-mcp-ui
      artifacts: true
  rules:
    - if: '$BUILD_MCP_UI == "1"'
      when: on_success
    - when: never
  script:
    - install -d -m 0755 /srv/published/files/mcp-appliance-dev
    - install -m 0644 mcp-ui.tar.gz /srv/published/files/mcp-appliance-dev/ui.tar.gz
    - sha256sum /srv/published/files/mcp-appliance-dev/ui.tar.gz > /srv/published/files/mcp-appliance-dev/ui.tar.gz.sha256

build-mcp-appliance:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_MCP_APPLIANCE == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "api" && $BUILD_MCP_APPLIANCE == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  script:
    - sudo rm -rf build-mcp-appliance
    - sudo mkdir build-mcp-appliance
    - sudo mount -t tmpfs -o size=24G tmpfs build-mcp-appliance
    - sudo chown gitlab-runner:gitlab-runner build-mcp-appliance
    - ln -s "$CI_PROJECT_DIR/.git" build-mcp-appliance/.git
    - cd build-mcp-appliance
    - git checkout -f "$CI_COMMIT_SHA"
    - command -v npm >/dev/null 2>&1 || sudo dnf -y install npm
    - npm --prefix ts/build/packages/mcp-appliance/build/frontend ci
    - npm --prefix ts/build/packages/mcp-appliance/build/frontend run build
    - test -s ts/build/packages/mcp-appliance/usr/share/mcp-appliance/web/thinstation.svg
    - grep -q 'thinstation.svg' ts/build/packages/mcp-appliance/usr/share/mcp-appliance/web/index.html ts/build/packages/mcp-appliance/usr/share/mcp-appliance/web/assets/*.js
    - |
      if [[ -n "${MCP_APPLIANCE_CA_BUNDLE_URL:-}" ]]; then
        anchor_dir="ts/build/packages/site/etc/pki/ca-trust/source/anchors"
        mkdir -p "$anchor_dir"
        curl --fail --silent --show-error --location -o "$anchor_dir/mcp-appliance-site-ca.pem" "$MCP_APPLIANCE_CA_BUNDLE_URL"
        openssl x509 -in "$anchor_dir/mcp-appliance-site-ca.pem" -noout -subject -issuer
      fi
    - sudo env MAX_PARALLEL_DOWNLOADS="$MAX_PARALLEL_DOWNLOADS" MAX_DOWNLOADS_PER_MIRROR="$MAX_DOWNLOADS_PER_MIRROR" TS_EXTRA_PORTS="$MCP_APPLIANCE_EXTRA_PORTS" ./setup-chroot -i
    - sudo ./setup-chroot -e cp -a /build/conf/mcp-appliance/build.conf.example /build/build.conf
    - sudo ./setup-chroot -e cp -a /build/conf/mcp-appliance/thinstation.conf.buildtime /build/thinstation.conf.buildtime
    - sudo sed -i -E "s#^NET_HOSTNAME=.*#NET_HOSTNAME=${MCP_APPLIANCE_HOSTNAME}#" ts/build/thinstation.conf.buildtime
    - sudo sed -i -E "s#^TIME_ZONE=.*#TIME_ZONE=${MCP_APPLIANCE_TIME_ZONE}#" ts/build/thinstation.conf.buildtime
    - sudo ./setup-chroot -e stb
    - test -s ts/build/boot-images/grub/efi-source/EFI/BOOT/BOOTX64.EFI
    - test -s ts/build/boot-images/grub/thinstation-efi.iso
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - cp "build-mcp-appliance/ts/build/boot-images/grub/thinstation-efi.iso" "mcp-appliance-${STAMP}.iso"
    - sha256sum "mcp-appliance-${STAMP}.iso" > "mcp-appliance-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner mcp-appliance-*.iso mcp-appliance-*.iso.sha256
  artifacts:
    name: "mcp-appliance-$CI_COMMIT_SHORT_SHA"
    paths:
      - mcp-appliance-*.iso
      - mcp-appliance-*.iso.sha256
    expire_in: 14 days
  after_script:
    - sudo umount build-mcp-appliance || sudo umount -l build-mcp-appliance || true
    - sudo rm -rf build-mcp-appliance

stage-mcp-appliance-distro:
  stage: deploy
  tags:
    - distro
  needs:
    - job: build-mcp-appliance
      artifacts: true
  script:
    - |
      set -euo pipefail
      incoming="/srv/incoming/mcp-appliance"
      staging="/srv/incoming/.mcp-appliance-${CI_PIPELINE_ID}"
      payload="$staging/iso"
      rm -rf "$staging"
      install -d -m 0755 "$payload"
      mapfile -t isos < <(find "$CI_PROJECT_DIR" -maxdepth 1 -type f -name 'mcp-appliance-*.iso' | sort)
      test "${#isos[@]}" -eq 1
      iso="${isos[0]}"
      checksum="${iso}.sha256"
      test -s "$checksum"
      install -m 0644 "$iso" "$payload/$(basename "$iso")"
      install -m 0644 "$checksum" "$payload/$(basename "$checksum")"
      (
        cd "$staging"
        find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      )
      chmod 0644 "$staging/SHA256SUMS"
      touch "$staging/.ready"
      rm -rf "$incoming"
      mv "$staging" "$incoming"
      echo "Staged $(basename "$iso") at $incoming"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule" && $BUILD_MCP_APPLIANCE == "1"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "api" && $BUILD_MCP_APPLIANCE == "1"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never

trigger-publisher-mcp-appliance:
  extends: .trigger-publisher
  needs:
    - job: stage-mcp-appliance-distro
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule" && $BUILD_MCP_APPLIANCE == "1"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "api" && $BUILD_MCP_APPLIANCE == "1"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never
