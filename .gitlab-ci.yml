default:
  hooks:
    pre_get_sources_script:
      - sudo umount "$CI_PROJECT_DIR/build-tiny-networkmanager" 2>/dev/null || sudo umount -l "$CI_PROJECT_DIR/build-tiny-networkmanager" 2>/dev/null || true
      - sudo umount "$CI_PROJECT_DIR/build-grub-network-benchmark" 2>/dev/null || sudo umount -l "$CI_PROJECT_DIR/build-grub-network-benchmark" 2>/dev/null || true

variables:
  BUILD_NPM:
    value: "0"
    description: "Set to 1 to build the NPM appliance ISO."
  GITLAB_EE_VERSION:
    value: "19.4.1"
    description: "GitLab EE semantic version to bake into the appliance ISO (for example 19.4.0)."
  BUILD_GITLAB_EE:
    value: "0"
    description: "Set to 1 to build the versioned GitLab EE appliance ISO."
  MAX_PARALLEL_DOWNLOADS:
    value: "20"
    description: "Maximum number of concurrent DNF downloads during chroot setup."
  MAX_DOWNLOADS_PER_MIRROR:
    value: "20"
    description: "Maximum number of concurrent DNF downloads per mirror during chroot setup."
  TS_EXTRA_PORTS:
    value: "audit audit-libs audit-rules libcap-ng-utils bridge-utils dbus-glib dhcp-client docker-cli docker-buildx docker-compose docker-compose-switch containerd moby-filesystem runc tini-static moby-engine moby-engine-nano moby-engine-rootless-extras rootlesskit criu libnet pigz slirp4netns libslirp shadow-utils ebtables-legacy firewall-config firewalld firewalld-filesystem ipset ipset-libs libcap-ng-python3 python3-firewall python3-nftables libnfnetlink libnetfilter_conntrack dejavu-sans-fonts e2fsprogs gdisk parted nano gdk-pixbuf2-modules-extra gdk-pixbuf2-xlib gtk2-immodule-xim gtk2-immodules gtk2-engines device-mapper device-mapper-libs device-mapper-event device-mapper-multipath device-mapper-multipath-libs lvm2 lvm2-libs NetworkManager NetworkManager-libnm NetworkManager-bluetooth NetworkManager-wifi NetworkManager-wwan libnma mobile-broadband-provider-info network-manager-applet nm-connection-editor openresolv iptables-nft iptables-legacy iptables-legacy-libs iptables-libs iptables-services iptables-utils open-vm-tools open-vm-tools-desktop openssh-server python3-abrt-addon python3-tkinter qemu-guest-agent spice-vdagent sudo virtualbox-guest-additions vulkan-tools vulkan-validation-layers numlockx rgb xorg-x11-fonts-misc xset xe-guest-utilities-latest xmlsec1-gcrypt xmlsec1-gnutls xmlsec1-nss yad"
    description: "Official RPMs required by the shared appliance profile, preloaded in the initial chroot DNF transaction."

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - build
  - deploy
  - publish

build-npm:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_NPM == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - when: never

  script:
    - sudo rm -rf build
    - sudo mkdir build
    - sudo mount -t tmpfs -o size=32G tmpfs build
    - sudo chown gitlab-runner:gitlab-runner build

    # Recreate the working tree inside tmpfs using the existing repository metadata.
    - ln -s "$CI_PROJECT_DIR/.git" build/.git
    - cd build
    - git checkout -f "$CI_COMMIT_SHA"

    # Build Nginx Proxy Manager ThinStation image.
    - sudo env MAX_PARALLEL_DOWNLOADS="$MAX_PARALLEL_DOWNLOADS" MAX_DOWNLOADS_PER_MIRROR="$MAX_DOWNLOADS_PER_MIRROR" TS_EXTRA_PORTS="$TS_EXTRA_PORTS" ./setup-chroot -i
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/nginx-proxy-manager/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo sed -i 's/^#package nginx-proxy-manager/package nginx-proxy-manager/' ts/build/build.conf
    - sudo ./setup-chroot -e stb

    # Export and name the ISO.
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso "$CI_PROJECT_DIR/npm.iso"
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - mv npm.iso "npm-${STAMP}.iso"
    - sha256sum "npm-${STAMP}.iso" > "npm-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "npm-${STAMP}.iso" "npm-${STAMP}.iso.sha256"

  artifacts:
    name: "npm-$CI_COMMIT_SHORT_SHA"
    paths:
      - npm-*.iso
      - npm-*.iso.sha256
    expire_in: 14 days

  after_script:
    - sudo umount build || true
    - sudo rm -rf build


.deploy-repo:
  stage: deploy
  tags:
    - fedora
    - shell
  resource_group: distro-publisher
  script:
    - |
      set -Eeuo pipefail

      STAMPED_ISO="$(find . -maxdepth 1 -type f -name "$APPLIANCE_ARTIFACT_GLOB" -printf '%f\n' | sort | head -1)"
      [[ -n "$STAMPED_ISO" ]] || {
          echo "No $APPLIANCE_NAME ISO artifact was found using: $APPLIANCE_ARTIFACT_GLOB" >&2
          exit 1
      }

      STAMPED_SHA="${STAMPED_ISO}.sha256"
      [[ -f "$STAMPED_SHA" ]] || {
          echo "Missing checksum artifact: $STAMPED_SHA" >&2
          exit 1
      }

      PAYLOAD_DIR="$(mktemp -d)"
      trap 'rm -rf "$PAYLOAD_DIR"' EXIT

      mkdir -p "$PAYLOAD_DIR/iso"
      install -m 0644 "$STAMPED_ISO" "$PAYLOAD_DIR/iso/$STAMPED_ISO"
      install -m 0644 "$STAMPED_SHA" "$PAYLOAD_DIR/iso/$STAMPED_SHA"

      (
          cd "$PAYLOAD_DIR"
          find iso -type f -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
      )

      SSH=(
          ssh
          -i "$DISTRO_SSH_KEY"
          -o StrictHostKeyChecking=accept-new
      )

      RSYNC_SSH="ssh -i $DISTRO_SSH_KEY -o StrictHostKeyChecking=accept-new"
      REMOTE_STAGE="${DISTRO_INCOMING_ROOT}/.${APPLIANCE_PUBLISH_PROJECT}-${CI_PIPELINE_ID}"
      REMOTE_PAYLOAD="${DISTRO_INCOMING_ROOT}/${APPLIANCE_PUBLISH_PROJECT}"

      "${SSH[@]}" "${DISTRO_USER}@${DISTRO_HOST}"           "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"

      rsync           --archive           --delete           -e "$RSYNC_SSH"           "$PAYLOAD_DIR/"           "${DISTRO_USER}@${DISTRO_HOST}:${REMOTE_STAGE}/"

      "${SSH[@]}" "${DISTRO_USER}@${DISTRO_HOST}"           "set -eu; test ! -e '$REMOTE_PAYLOAD'; mv '$REMOTE_STAGE' '$REMOTE_PAYLOAD'; touch '$REMOTE_PAYLOAD/.ready'"

      trap - EXIT
      rm -rf "$PAYLOAD_DIR"

      echo "Submitted $APPLIANCE_NAME as ${REMOTE_PAYLOAD} for repository publishing"

deploy-npm:
  extends: .deploy-repo
  variables:
    APPLIANCE_NAME: "npm"
    APPLIANCE_PUBLISH_PROJECT: "npm"
    APPLIANCE_ARTIFACT_GLOB: "npm-*.iso"
  needs:
    - job: build-npm
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_NPM == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - when: never

deploy-gitlab-ee:
  extends: .deploy-repo
  variables:
    APPLIANCE_NAME: "gitlab-ee"
    APPLIANCE_PUBLISH_PROJECT: "gitlab-ee"
    APPLIANCE_ARTIFACT_GLOB: "gitlab-ee-*.iso"
  needs:
    - job: build-gitlab-ee
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_GITLAB_EE == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - when: never

.trigger-publisher:
  stage: publish
  trigger:
    project: $PUBLISH_ARTIFACTS_PROJECT
    branch: $PUBLISH_ARTIFACTS_BRANCH
    strategy: depend

trigger-publisher-npm:
  extends: .trigger-publisher
  needs:
    - job: deploy-npm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_NPM == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - when: never

trigger-publisher-gitlab-ee:
  extends: .trigger-publisher
  needs:
    - job: deploy-gitlab-ee
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_GITLAB_EE == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - when: never


build-gitlab-ee:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_GITLAB_EE == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - when: never

  script:
    - |
      set -Eeuo pipefail
      [[ "$GITLAB_EE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
        echo "GITLAB_EE_VERSION must be major.minor.patch, got: $GITLAB_EE_VERSION" >&2
        exit 1
      }

    - sudo rm -rf build-gitlab-ee
    - sudo mkdir build-gitlab-ee
    - sudo mount -t tmpfs -o size=40G tmpfs build-gitlab-ee
    - sudo chown gitlab-runner:gitlab-runner build-gitlab-ee
    - ln -s "$CI_PROJECT_DIR/.git" build-gitlab-ee/.git
    - cd build-gitlab-ee
    - git checkout -f "$CI_COMMIT_SHA"
    - sudo env MAX_PARALLEL_DOWNLOADS="$MAX_PARALLEL_DOWNLOADS" MAX_DOWNLOADS_PER_MIRROR="$MAX_DOWNLOADS_PER_MIRROR" TS_EXTRA_PORTS="$TS_EXTRA_PORTS" ./setup-chroot -i
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo sed -i 's/^#package gitlab-ee/package gitlab-ee/' ts/build/build.conf
    - |
      if [[ -n "${MCP_SSH_PUBLIC_KEY:-}" ]]; then
        sudo sed -i 's/^#package openssh/package openssh/' ts/build/build.conf
        printf '%s\n' 'param authorized_keys /authorized_keys' \
          | sudo tee -a ts/build/build.conf >/dev/null
        printf '%s\n' "$MCP_SSH_PUBLIC_KEY" \
          | sudo tee authorized_keys >/dev/null
      else
        echo "MCP_SSH_PUBLIC_KEY is not set; skipping debug SSH key injection."
      fi

    - sudo sed -i -E "s#gitlab/gitlab-ee:[0-9]+\\.[0-9]+\\.[0-9]+-ee\\.0#gitlab/gitlab-ee:${GITLAB_EE_VERSION}-ee.0#" ts/build/packages/gitlab-ee/build/images.conf
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/gitlab-ee/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e stb
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso "$CI_PROJECT_DIR/gitlab-ee.iso"
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - mv gitlab-ee.iso "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso"
    - sha256sum "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso" > "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso" "gitlab-ee-${GITLAB_EE_VERSION}-${STAMP}.iso.sha256"

  artifacts:
    name: "gitlab-ee-${GITLAB_EE_VERSION}-$CI_COMMIT_SHORT_SHA"
    paths:
      - gitlab-ee-*.iso
      - gitlab-ee-*.iso.sha256
    expire_in: 30 days

  after_script:
    - sudo umount build-gitlab-ee || true
    - sudo rm -rf build-gitlab-ee

test-ipxe-sibling-config:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - when: never
  script:
    - |
      set -Eeuo pipefail

      work="$CI_PROJECT_DIR/ipxe-sibling-test"
      rm -rf "$work"
      mkdir -p "$work/tftp/nested/boot" "$work/src"

      sudo dnf install -y qemu-system-x86 edk2-ovmf ipxe-roms-qemu gcc make perl xz-devel zlib-devel git cpio dnf-plugins-core tcpdump

      git clone --depth 1 --branch v2.0.0 https://github.com/ipxe/ipxe.git "$work/src/ipxe"

      cat > "$work/bios-bootstrap.ipxe" <<'EOF'
      #!ipxe
      echo TSIPXE_BIOS_BOOTSTRAP
      echo cwuri=${cwuri}
      echo cwduri=${cwduri}
      echo filename=${filename}
      echo next-server=${next-server}
      chain autoexec.ipxe || goto failed
      exit
      :failed
      echo TSIPXE_BIOS_CHAIN_FAILED
      sleep 2
      exit 1
      EOF

      make -C "$work/src/ipxe/src" -j"$(nproc)" NO_WERROR=1 bin/undionly.kpxe EMBED="$work/bios-bootstrap.ipxe"
      cp "$work/src/ipxe/src/bin/undionly.kpxe" "$work/tftp/nested/undionly.kpxe"

      mkdir -p "$work/f45"
      dnf download --destdir "$work/f45" --releasever=45 --repo=fedora ipxe-bootimgs-x86
      rpm2cpio "$work"/f45/ipxe-bootimgs-x86-*.rpm | (cd "$work/f45" && cpio -idm --quiet)
      uefi_image="$(find "$work/f45" -type f \( -name 'ipxe-snponly-x86_64.efi' -o -name 'ipxe-x86_64.efi' \) | head -1)"
      test -n "$uefi_image"
      cp "$uefi_image" "$work/tftp/nested/ipxe.efi"

      cat > "$work/tftp/nested/autoexec.ipxe" <<'EOF'
      #!ipxe
      echo TSIPXE_AUTOEXEC
      echo cwuri=${cwuri}
      echo cwduri=${cwduri}
      echo filename=${filename}
      echo next-server=${next-server}
      chain thinstation.ipxe || goto failed
      exit
      :failed
      echo TSIPXE_AUTOEXEC_CHAIN_FAILED
      sleep 2
      exit 1
      EOF

      cat > "$work/tftp/nested/thinstation.ipxe" <<'EOF'
      #!ipxe
      echo TSIPXE_SIBLING_CONFIG_OK
      echo config-cwuri=${cwuri}
      echo config-cwduri=${cwduri}
      sleep 2
      exit
      EOF

      run_bios() {
        timeout 15 qemu-system-x86_64 \
          -accel kvm -machine q35 -m 512 -smp 1 -boot n \
          -device e1000,netdev=n1 \
          -netdev user,id=n1,tftp="$work/tftp",bootfile=/nested/undionly.kpxe \
          -object filter-dump,id=dump1,netdev=n1,file="$work/bios.pcap" \
          -display none -monitor none -serial stdio -no-reboot \
          2>&1 | tee "$work/bios.log" || true
      }

      run_uefi() {
        ovmf_code="$(find /usr/share/edk2 /usr/share/OVMF -type f \( -name 'OVMF_CODE.fd' -o -name 'OVMF_CODE.secboot.fd' \) 2>/dev/null | head -1)"
        test -n "$ovmf_code"
        timeout 20 qemu-system-x86_64 \
          -accel kvm -machine q35 -m 512 -smp 1 -boot n \
          -drive if=pflash,format=raw,readonly=on,file="$ovmf_code" \
          -device e1000,netdev=n1,romfile=/usr/share/ipxe/qemu/efi-e1000.rom \
          -netdev user,id=n1,tftp="$work/tftp",bootfile=/nested/ipxe.efi \
          -object filter-dump,id=dump1,netdev=n1,file="$work/uefi.pcap" \
          -display none -monitor none -serial stdio -no-reboot \
          2>&1 | tee "$work/uefi.log" || true
      }

      run_bios
      run_uefi

      tcpdump -nn -vvv -r "$work/bios.pcap" > "$work/bios.packets" 2>&1 || true
      tcpdump -nn -vvv -r "$work/uefi.pcap" > "$work/uefi.packets" 2>&1 || true

      echo "=== BIOS TFTP requests ==="
      grep -E 'RRQ|undionly|autoexec|thinstation' "$work/bios.packets" || true
      echo "=== UEFI TFTP requests ==="
      grep -E 'RRQ|ipxe.efi|autoexec|thinstation' "$work/uefi.packets" || true

      strings "$work/bios.pcap" > "$work/bios.strings"
      strings "$work/uefi.pcap" > "$work/uefi.strings"

      grep -q 'nested/autoexec.ipxe' "$work/bios.strings" || {
        echo "BIOS did not request sibling nested/autoexec.ipxe" >&2
        exit 1
      }
      grep -q 'nested/thinstation.ipxe' "$work/bios.strings" || {
        echo "BIOS autoexec did not request sibling nested/thinstation.ipxe" >&2
        exit 1
      }
      grep -q 'nested/autoexec.ipxe' "$work/uefi.strings" || {
        echo "UEFI did not auto-request nested/autoexec.ipxe" >&2
        exit 1
      }
      grep -q 'nested/thinstation.ipxe' "$work/uefi.strings" || {
        echo "UEFI autoexec did not request sibling nested/thinstation.ipxe" >&2
        exit 1
      }

  artifacts:
    when: always
    paths:
      - ipxe-sibling-test/bios.log
      - ipxe-sibling-test/uefi.log
      - ipxe-sibling-test/bios-bootstrap.ipxe
      - ipxe-sibling-test/bios.pcap
      - ipxe-sibling-test/uefi.pcap
      - ipxe-sibling-test/bios.packets
      - ipxe-sibling-test/uefi.packets
      - ipxe-sibling-test/tftp/nested/autoexec.ipxe
      - ipxe-sibling-test/tftp/nested/thinstation.ipxe
    expire_in: 14 days

