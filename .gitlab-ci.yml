stages:
  - build
  - deploy

build-image:
  stage: build
#  image: fedora:44
  tags:
    - fedora-shell

  before_script:
    - sudo rm -rf out

  script:
    - sudo mkdir build
    - sudo mv ts build/.
    - sudo mv setup-chroot build/.
    - sudo mv README.md build/.
    - cd build
    - sudo ./setup-chroot -i
    - sudo ./setup-chroot -e dnf install -y --setopt=keepcache=1 --setopt=max_parallel_downloads=10 docker
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/nginx-proxy-manager/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo ./setup-chroot -e stb
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso ../npm.iso
    - STAMP="$(date -d "$CI_PIPELINE_CREATED_AT" +%m%d%Y%H%M%S)"
    - mv ../npm.iso "../npm-${STAMP}.iso"
    - cd ..
    - sha256sum "npm-${STAMP}.iso" > "npm-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "npm-${STAMP}.iso" "npm-${STAMP}.iso.sha256"

  artifacts:
    name: "npm-$CI_COMMIT_SHORT_SHA"
    paths:
      - npm-*.iso
      - npm-*.iso.sha256
    expire_in: 14 days

  after_script:
    - sudo rm -rf build

deploy_repo:
  stage: deploy
  tags:
    - fedora-shell
  script:
    - rsync -av -e "ssh -i /home/gitlab-runner/.ssh/repo_deploy -o StrictHostKeyChecking=accept-new" npm-*.iso npm-*.iso.sha256 gitlab-deploy@distro:/srv/incoming/iso/npm/