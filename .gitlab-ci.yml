stages:
  - build

build-image:
  stage: build
  image: fedora:44
  tags:
    - docker
  before_script:
    - dnf -y update
    - dnf -y install git make xz tar gzip sudo curl findutils util-linux procps-ng which
  script:
    - ./setup-chroot -i
    - ./setup-chroot -e cp /build/conf/tiny /build/.
    - ./setup-chroot -e stb
    #- make image
    # or: ./build.sh
    # or: ./build-image.sh
    - mkdir out
    - cp -v ts/build/boot-images/grub/thinstation-efi.iso out/
  artifacts:
    name: "image-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - out/
    expire_in: 14 days