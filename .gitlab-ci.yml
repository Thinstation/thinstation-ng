stages:
  - build

build-image:
  stage: build
  image: fedora:44
  tags:
    - fedora-shell
  # before_script:
  #   - dnf -y update
  #   - dnf -y install git make xz tar gzip sudo curl findutils util-linux procps-ng which
  before_script:
    - sudo rm -rf out
  script:
    - sudo mkdir build
    - sudo mv ts build/.
    - sudo mv setup-chroot build/.
    - sudo mv README.md build/.
    - cd build
    - sudo ./setup-chroot -i
    - sudo ./setup-chroot -e dnf install -y --setopt=keepcache=1 --setopt=max_parallel_downloads=10 docker
    #- ./setup-chroot -e cp /build/conf/tiny/* /build/.
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/nginx-proxy-manager/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo ./setup-chroot -e stb
    #- make image
    # or: ./build.sh
    # or: ./build-image.sh
#    - sudo mkdir ../out
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso ../npm.iso
    - sudo chown gitlab-runner:gitlab-runner ../npm.iso
    #- sudo rm -rf *
    #- sudo mv ../out .
  artifacts:
    name: "npm-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - npm.iso
    expire_in: 14 days
  after_script:
    - sudo rm -rf build
