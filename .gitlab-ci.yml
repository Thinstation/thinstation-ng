stages:
  - build
  - deploy

variables:
  PUBLISH_PROJECT: "npm"
  DISTRO_HOST: "distro"
  DISTRO_USER: "gitlab-runner"
  DISTRO_INCOMING_ROOT: "/srv/incoming"
  DISTRO_SSH_KEY: "/home/gitlab-runner/.ssh/repo_deploy"

build-image:
  stage: build
  tags:
    - Fedora
    - Shell

  script:
    - sudo rm -rf build
    - sudo mkdir build
    - sudo mount -t tmpfs -o size=32G tmpfs build
    - sudo chown gitlab-runner:gitlab-runner build

    # Recreate the working tree inside tmpfs using the existing repository metadata.
    - ln -s "$CI_PROJECT_DIR/.git" build/.git
    - cd build
    - git checkout -f "$CI_COMMIT_SHA"

    # Build Nginx Proxy Manager ThinStation image.
    - sudo ./setup-chroot -i
    - sudo ./setup-chroot -e dnf install -y --setopt=keepcache=1 --setopt=max_parallel_downloads=10 docker
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/nginx-proxy-manager/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo ./setup-chroot -e stb

    # Export and name the ISO.
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso "$CI_PROJECT_DIR/npm.iso"
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - mv npm.iso "npm-${STAMP}.iso"
    - sha256sum "npm-${STAMP}.iso" > "npm-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "npm-${STAMP}.iso" "npm-${STAMP}.iso.sha256"

  artifacts:
    name: "npm-$CI_COMMIT_SHORT_SHA"
    paths:
      - npm-*.iso
      - npm-*.iso.sha256
    expire_in: 14 days

  after_script:
    - sudo umount build || true
    - sudo rm -rf build

deploy_repo:
  stage: deploy
  tags:
    - Fedora
    - Shell
  resource_group: distro-publisher
  needs:
    - job: build-image
      artifacts: true

  script:
    - |
      set -Eeuo pipefail

      STAMPED_ISO="$(find . -maxdepth 1 -type f -name 'npm-*.iso' -printf '%f\n' | sort | head -1)"
      [[ -n "$STAMPED_ISO" ]] || {
          echo "No npm ISO artifact was found" >&2
          exit 1
      }

      STAMPED_SHA="${STAMPED_ISO}.sha256"
      [[ -f "$STAMPED_SHA" ]] || {
          echo "Missing checksum artifact: $STAMPED_SHA" >&2
          exit 1
      }

      PAYLOAD_DIR="$(mktemp -d)"
      trap 'rm -rf "$PAYLOAD_DIR"' EXIT

      mkdir -p "$PAYLOAD_DIR/iso"
      install -m 0644 "$STAMPED_ISO" "$PAYLOAD_DIR/iso/$STAMPED_ISO"
      install -m 0644 "$STAMPED_SHA" "$PAYLOAD_DIR/iso/$STAMPED_SHA"

      (
          cd "$PAYLOAD_DIR"
          find iso -type f -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
      )

      SSH=(
          ssh
          -i "$DISTRO_SSH_KEY"
          -o StrictHostKeyChecking=accept-new
      )

      RSYNC_SSH="ssh -i $DISTRO_SSH_KEY -o StrictHostKeyChecking=accept-new"
      REMOTE_STAGE="${DISTRO_INCOMING_ROOT}/.${PUBLISH_PROJECT}-${CI_PIPELINE_ID}"
      REMOTE_PAYLOAD="${DISTRO_INCOMING_ROOT}/${PUBLISH_PROJECT}"

      # Upload to a hidden staging directory so the publisher cannot see a
      # partially transferred payload.
      "${SSH[@]}" "${DISTRO_USER}@${DISTRO_HOST}" \
          "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"

      rsync \
          --archive \
          --delete \
          -e "$RSYNC_SSH" \
          "$PAYLOAD_DIR/" \
          "${DISTRO_USER}@${DISTRO_HOST}:${REMOTE_STAGE}/"

      # Publish the completed directory atomically, then create .ready last.
      "${SSH[@]}" "${DISTRO_USER}@${DISTRO_HOST}" \
          "set -eu; test ! -e '$REMOTE_PAYLOAD'; mv '$REMOTE_STAGE' '$REMOTE_PAYLOAD'; touch '$REMOTE_PAYLOAD/.ready'"

      trap - EXIT
      rm -rf "$PAYLOAD_DIR"

      echo "Submitted ${REMOTE_PAYLOAD} for repository publishing"
