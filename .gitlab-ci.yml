default:
  hooks:
    pre_get_sources_script:
      - sudo umount "$CI_PROJECT_DIR/build-tiny-networkmanager" 2>/dev/null || sudo umount -l "$CI_PROJECT_DIR/build-tiny-networkmanager" 2>/dev/null || true
      - sudo umount "$CI_PROJECT_DIR/build-grub-network-benchmark" 2>/dev/null || sudo umount -l "$CI_PROJECT_DIR/build-grub-network-benchmark" 2>/dev/null || true

variables:
  BUILD_NPM:
    value: "0"
    description: "Set to 1 to build the NPM appliance ISO."
  INFISICAL_VERSION:
    value: "0.165.16"
    description: "Infisical semantic version to bake into the vault appliance ISO."
  INFISICAL_POSTGRES_IMAGE:
    value: "14.24-alpine3.23"
    description: "Pinned PostgreSQL image tag for the Infisical vault appliance."
  INFISICAL_REDIS_IMAGE:
    value: "7.4.7-alpine3.21"
    description: "Pinned Redis image tag for the Infisical vault appliance."
  BUILD_INFISICAL_VAULT:
    value: "0"
    description: "Set to 1 to build the Infisical vault appliance ISO."
  WARPGATE_VERSION:
    value: "0.29.1"
    description: "Pinned Warpgate version for the Infisical-backed credential broker appliance."
  INFISICAL_CLI_VERSION:
    value: "0.43.138"
    description: "Pinned Infisical CLI version providing Agent Proxy for HTTP/HTTPS/REST brokering."
  BUILD_WARPGATE_INFISICAL:
    value: "0"
    description: "Set to 1 to build the Warpgate + Infisical broker appliance ISO."
  GITLAB_EE_VERSION:
    value: "19.4.1"
    description: "GitLab EE semantic version to bake into the appliance ISO (for example 19.4.0)."
  BUILD_GITLAB_EE:
    value: "0"
    description: "Set to 1 to build the versioned GitLab EE appliance ISO."
  BUILD_MCP_APPLIANCE:
    value: "0"
    description: "Set to 1 to build and publish the MCP appliance ISO."
  BUILD_MCP_UI:
    value: "0"
    description: "Set to 1 to build and publish only the MCP appliance frontend for dev-web testing."
  MCP_APPLIANCE_HOSTNAME:
    value: "mcp-appliance"
    description: "Hostname stamped into thinstation.conf.buildtime for MCP appliance builds."
  MCP_APPLIANCE_TIME_ZONE:
    value: "UTC"
    description: "Timezone stamped into thinstation.conf.buildtime for MCP appliance builds."
  MCP_APPLIANCE_CA_BUNDLE_URL:
    value: "https://distro.thinstation.org/thinstation_ca_bundle.pem"
    description: "Optional site CA bundle injected into MCP appliance trust at build time. Leave empty for public-CA-only builds."
  MCP_APPLIANCE_EXTRA_PORTS:
    value: "NetworkManager NetworkManager-libnm openresolv nftables nftables-services iptables-libs iptables-utils iptables-nft openssh openssh-clients openssh-server curl libcurl-minimal python3 python-unversioned-command python3-libs openssl openssl-libs tpm2-tss json-c libusb1 ca-certificates util-linux util-linux-core qemu-guest-agent dehydrated bind-utils krb5-workstation qrencode qrencode-libs libpng s-nail lvm2 lvm2-libs e2fsprogs xfsprogs kernel-devel zstd libzstd lz4 lz4-libs dnf5 libdnf5 libdnf5-cli rpm rpm-libs rpm-plugin-audit rpm-sequoia fedora-repos-44 fedora-release-common fedora-release-identity-basic fedora-gpg-keys nfs-utils nfs-utils-coreos cifs-utils samba-client sssd sssd-ad sssd-common sssd-krb5 sssd-krb5-common sssd-ldap oddjob oddjob-mkhomedir realmd adcli freerdp freerdp-libs xorg-x11-server-Xvfb xdotool"
    description: "Minimal RPM preload required by the MCP appliance package recipes."
  MAX_PARALLEL_DOWNLOADS:
    value: "20"
    description: "Maximum number of concurrent DNF downloads during chroot setup."
  MAX_DOWNLOADS_PER_MIRROR:
    value: "20"
    description: "Maximum number of concurrent DNF downloads per mirror during chroot setup."
  TS_EXTRA_PORTS:
    value: "audit audit-libs audit-rules libcap-ng-utils bridge-utils dbus-glib dhcp-client docker-cli docker-buildx docker-compose docker-compose-switch containerd moby-filesystem runc tini-static moby-engine moby-engine-nano moby-engine-rootless-extras rootlesskit criu libnet pigz slirp4netns libslirp shadow-utils ebtables-legacy firewall-config firewalld firewalld-filesystem ipset ipset-libs libcap-ng-python3 python3-firewall python3-nftables libnfnetlink libnetfilter_conntrack dejavu-sans-fonts e2fsprogs gdisk parted nano gdk-pixbuf2-modules-extra gdk-pixbuf2-xlib gtk2-immodule-xim gtk2-immodules gtk2-engines device-mapper device-mapper-libs device-mapper-event device-mapper-multipath device-mapper-multipath-libs lvm2 lvm2-libs NetworkManager NetworkManager-libnm NetworkManager-bluetooth NetworkManager-wifi NetworkManager-wwan libnma mobile-broadband-provider-info network-manager-applet nm-connection-editor openresolv iptables-nft iptables-legacy iptables-legacy-libs iptables-libs iptables-services iptables-utils open-vm-tools open-vm-tools-desktop openssh-server python3-abrt-addon python3-tkinter qemu-guest-agent spice-vdagent sudo virtualbox-guest-additions vulkan-tools vulkan-validation-layers numlockx rgb xorg-x11-fonts-misc xset xe-guest-utilities-latest xmlsec1-gcrypt xmlsec1-gnutls xmlsec1-nss yad"
    description: "Official RPMs required by the shared appliance profile, preloaded in the initial chroot DNF transaction."

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

stages:
  - build
  - deploy
  - publish

build-npm:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_NPM == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - when: never

  script:
    - sudo rm -rf build
    - sudo mkdir build
    - sudo mount -t tmpfs -o size=32G tmpfs build
    - sudo chown gitlab-runner:gitlab-runner build

    # Recreate the working tree inside tmpfs using the existing repository metadata.
    - ln -s "$CI_PROJECT_DIR/.git" build/.git
    - cd build
    - git checkout -f "$CI_COMMIT_SHA"

    # Build Nginx Proxy Manager ThinStation image.
    - sudo env MAX_PARALLEL_DOWNLOADS="$MAX_PARALLEL_DOWNLOADS" MAX_DOWNLOADS_PER_MIRROR="$MAX_DOWNLOADS_PER_MIRROR" TS_EXTRA_PORTS="$TS_EXTRA_PORTS" ./setup-chroot -i
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/nginx-proxy-manager/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo sed -i 's/^#package nginx-proxy-manager/package nginx-proxy-manager/' ts/build/build.conf
    - sudo ./setup-chroot -e stb

    # Export and name the ISO.
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso "$CI_PROJECT_DIR/npm.iso"
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - mv npm.iso "npm-${STAMP}.iso"
    - sha256sum "npm-${STAMP}.iso" > "npm-${STAMP}.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "npm-${STAMP}.iso" "npm-${STAMP}.iso.sha256"

  artifacts:
    name: "npm-$CI_COMMIT_SHORT_SHA"
    paths:
      - npm-*.iso
      - npm-*.iso.sha256
    expire_in: 14 days

  after_script:
    - sudo umount build || true
    - sudo rm -rf build


build-warpgate-infisical:
  stage: build
  tags:
    - fedora
    - shell
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_WARPGATE_INFISICAL == "1"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - when: never
  script:
    - |
      set -Eeuo pipefail
      [[ "$WARPGATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
        echo "WARPGATE_VERSION must be major.minor.patch, got: $WARPGATE_VERSION" >&2
        exit 1
      }
    - sudo rm -rf build-warpgate-infisical
    - sudo mkdir build-warpgate-infisical
    - sudo mount -t tmpfs -o size=40G tmpfs build-warpgate-infisical
    - sudo chown gitlab-runner:gitlab-runner build-warpgate-infisical
    - ln -s "$CI_PROJECT_DIR/.git" build-warpgate-infisical/.git
    - cd build-warpgate-infisical
    - git checkout -f "$CI_COMMIT_SHA"
    - sudo env MAX_PARALLEL_DOWNLOADS="$MAX_PARALLEL_DOWNLOADS" MAX_DOWNLOADS_PER_MIRROR="$MAX_DOWNLOADS_PER_MIRROR" TS_EXTRA_PORTS="$TS_EXTRA_PORTS" ./setup-chroot -i
    - sudo ./setup-chroot -e cp -a /build/conf/boot2docker/* /build/.
    - sudo sed -i 's/^#package warpgate-infisical/package warpgate-infisical/' ts/build/build.conf
    - sudo ./setup-chroot -e docker build --build-arg WARPGATE_VERSION="$WARPGATE_VERSION" -t thinstation/warpgate-infisical:"$WARPGATE_VERSION" -f /build/packages/warpgate-infisical/build/image/Dockerfile /build/packages/warpgate-infisical/build/image
    - sudo sed -i -E "s#local:thinstation/warpgate-infisical:[0-9]+\.[0-9]+\.[0-9]+#local:thinstation/warpgate-infisical:$WARPGATE_VERSION#" ts/build/packages/warpgate-infisical/build/images.conf
    - sudo sed -i -E "s#infisical/cli:[0-9]+\.[0-9]+\.[0-9]+#infisical/cli:$INFISICAL_CLI_VERSION#" ts/build/packages/warpgate-infisical/build/images.conf
    - sudo sed -i -E "s#infisical/cli:[0-9]+\.[0-9]+\.[0-9]+#infisical/cli:$INFISICAL_CLI_VERSION#" ts/build/packages/warpgate-infisical/build/extra/usr/lib/thinstation/docker-stacks/warpgate/docker-compose.yml
    - sudo ./setup-chroot -e ts/bin/export-docker-images build/packages/warpgate-infisical/build/images.conf build/boot-images/grub/efi-source/Docker
    - sudo ./setup-chroot -e stb
    - sudo mv ts/build/boot-images/grub/thinstation-efi.iso "$CI_PROJECT_DIR/warpgate-infisical.iso"
    - cd "$CI_PROJECT_DIR"
    - STAMP="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%dT%H%M%SZ)"
    - mv warpgate-infisical.iso "warpgate-infisical-$WARPGATE_VERSION-$STAMP.iso"
    - sha256sum "warpgate-infisical-$WARPGATE_VERSION-$STAMP.iso" > "warpgate-infisical-$WARPGATE_VERSION-$STAMP.iso.sha256"
    - sudo chown gitlab-runner:gitlab-runner "warpgate-infisical-$WARPGATE_VERSION-$STAMP.iso" "warpgate-infisical-$WARPGATE_VERSION-$STAMP.iso.sha256"
  artifacts:
    name: "warpgate-infisical-$WARPGATE_VERSION-$CI_COMMIT_SHORT_SHA"
    paths:
      - warpgate-infisical-*.iso
      - warpgate-infisical-*.iso.sha256
    expire_in: 30 days
  after_script:
    - sudo umount build-warpgate-infisical || true
    - sudo rm -rf build-warpgate-infisical

