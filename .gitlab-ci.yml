.deploy-repo:
  stage: deploy
  tags:
    - fedora
    - shell
  resource_group: distro-publisher
  script:
    - |
      set -Eeuo pipefail

      STAMPED_ISO="$(find . -maxdepth 1 -type f -name "$APPLIANCE_ARTIFACT_GLOB" -printf '%f\n' | sort | head -1)"
      [[ -n "$STAMPED_ISO" ]] || {
          echo "No $APPLIANCE_NAME ISO artifact was found using: $APPLIANCE_ARTIFACT_GLOB" >&2
          exit 1
      }

      STAMPED_SHA="${STAMPED_ISO}.sha256"
      [[ -f "$STAMPED_SHA" ]] || {
          echo "Missing checksum artifact: $STAMPED_SHA" >&2
          exit 1
      }

      PAYLOAD_DIR="$(mktemp -d)"
      trap 'rm -rf "$PAYLOAD_DIR"' EXIT

      mkdir -p "$PAYLOAD_DIR/iso"
      install -m 0644 "$STAMPED_ISO" "$PAYLOAD_DIR/iso/$STAMPED_ISO"
      install -m 0644 "$STAMPED_SHA" "$PAYLOAD_DIR/iso/$STAMPED_SHA"

      (
          cd "$PAYLOAD_DIR"
          find iso -type f -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
      )

      SSH=(
          ssh
          -i "$DISTRO_SSH_KEY"
          -o StrictHostKeyChecking=accept-new
      )

      RSYNC_SSH="ssh -i $DISTRO_SSH_KEY -o StrictHostKeyChecking=accept-new"
      REMOTE_STAGE="${DISTRO_INCOMING_ROOT}/.${APPLIANCE_PUBLISH_PROJECT}-${CI_PIPELINE_ID}"
      REMOTE_PAYLOAD="${DISTRO_INCOMING_ROOT}/${APPLIANCE_PUBLISH_PROJECT}"

      "${SSH[@]}" "${DISTRO_USER}@${DISTRO_HOST}"           "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"

      rsync           --archive           --delete           -e "$RSYNC_SSH"           "$PAYLOAD_DIR/"           "${DISTRO_USER}@${DISTRO_HOST}:${REMOTE_STAGE}/"

      "${SSH[@]}" "${DISTRO_USER}@${DISTRO_HOST}"           "set -eu; test ! -e '$REMOTE_PAYLOAD'; mv '$REMOTE_STAGE' '$REMOTE_PAYLOAD'; touch '$REMOTE_PAYLOAD/.ready'"

      trap - EXIT
      rm -rf "$PAYLOAD_DIR"

      echo "Submitted $APPLIANCE_NAME as ${REMOTE_PAYLOAD} for repository publishing"

deploy-npm:
