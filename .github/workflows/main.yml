name: Build & Deploy Busybox RPMs

on:
  push:
    branches:
      - 7.2-beta
    tags:
      - "*"
  pull_request:
    branches:
      - 7.2-beta
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:42

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools createrepo_c
          dnf install -y libv4l-devel
          dnf install -y 'dnf-command(builddep)'
      - name: Set up RPM build environment
        run: |
          rpmdev-setuptree
      - name: Download Fedora's Busybox Source RPM
        run: |
          dnf download --source busybox
          rpm -ivh busybox-*.src.rpm
      - name: Apply patches to spec file
        run: |
          cd ~/rpmbuild/SPECS
          cp $GITHUB_WORKSPACE/patches/SPECS/*.patch ~/rpmbuild/SPECS/
          for patch in *.patch; do
            patch -p1 < "$patch"
          done
      - name: Install Build Dependencies
        run: |
          dnf builddep -y ~/rpmbuild/SPECS/busybox.spec
      - name: Build the RPM
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/busybox.spec
      - name: Prepare RPM Repository
        run: |
          mkdir -p repo
          cp ~/rpmbuild/RPMS/**/*.rpm repo/
          createrepo_c repo/
      - name: Upload RPMs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox
          path: repo/

  deploy:
    needs: build-rpm
    runs-on: ubuntu-latest
    # The deploy job only runs when a tag is pushed or if the workflow is triggered manually.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write  # Required for GitHub Pages deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download Built RPMs
        uses: actions/download-artifact@v4
        with:
          name: busybox
          path: repo/

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/
