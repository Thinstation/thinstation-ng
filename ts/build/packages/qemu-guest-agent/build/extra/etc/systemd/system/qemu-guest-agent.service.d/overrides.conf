[Unit]
# Order any activation after the fastboot filesystem is ready.
After=fastboot.service

[Service]
# Optional extra arguments; the RPM EnvironmentFile can override this default.
Environment=QEMU_GA_ARGS=
Restart=always
RestartSec=1

[Install]
# Replace the RPM's device install target with ThinStation initialization.
WantedBy=
WantedBy=tsinit.target
