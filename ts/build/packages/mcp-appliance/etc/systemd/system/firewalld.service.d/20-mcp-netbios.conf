[Unit]
# Restore persisted firewall files before pruning unsupported legacy services.
After=persistent-files.service persistent-dirs.service

[Service]
# The vendor unit uses ProtectSystem=yes. Scope the pre-start guard's writes.
ReadWritePaths=/usr/lib/firewalld/services
ReadWritePaths=-/etc/firewalld/zones
ExecStartPre=/usr/bin/mcp-firewalld-netbios-guard
