[Unit]
Requires=appliance-acme-bootstrap.service
After=appliance-acme-bootstrap.service docker-storage-mount.service

[Service]
ExecStartPre=
ExecStart=
ExecReload=
ExecStartPre=/usr/bin/lighttpd -tt -f /run/lighttpd-infisical.conf
ExecStart=/usr/bin/lighttpd -D -f /run/lighttpd-infisical.conf
ExecReload=/bin/kill -HUP $MAINPID

# Appliance TLS frontend hardening.  This instance only terminates TLS and
# proxies to the loopback Infisical backend.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectHostname=yes
ProtectClock=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectProc=invisible
ProcSubset=pid
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETGID CAP_SETUID
AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_SETGID CAP_SETUID
SystemCallArchitectures=native
